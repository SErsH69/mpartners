default:
  image: node:18.20.3
  tags:
    - landings
    - build

stages:
  - lint
  - test
  - code_quality
  - build

.default_scripts: &default_scripts
  - yarn install --immutable --silent

cache:
  key: "${CI_PROJECT_PATH_SLUG}-node-modules"
  paths:
    - node_modules/
  policy: pull-push

php-syntax-job:
  # using same image and cache for codeqiality jobs
  image: composer:2.5
  stage: lint
  interruptible: true
  variables:
    COMPOSER_CACHE_DIR: "/cache/composer"
  cache:
    key: "${CI_PROJECT_PATH_SLUG}-composer-lint"
    paths:
      - vendor/
      - /cache/composer/
    policy: pull-push
  before_script:
    - composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
  script:
    - echo "PHP syntax check started for updated files."
    - chmod +x ./scripts/php-changed.sh
    - bash ./scripts/php-changed.sh
    - echo "PHP syntax check completed."

lint-job:
  stage: lint
  interruptible: true
  script:
    - *default_scripts
    - echo "JS Linting process started."
    - yarn lint
    - echo "JS Linting process completed."

lint-css-job:
  stage: lint
  interruptible: true
  script:
    - *default_scripts
    - echo "CSS Linting process started."
    - chmod +x ./scripts/lint-changed-scss.sh
    - yarn lint:css
    - echo "CSS Linting process completed."

phpcs-quality-job:
  image: composer:2.5
  stage: code_quality
  interruptible: true
  variables:
    COMPOSER_CACHE_DIR: "/cache/composer"
  cache:
    key: "${CI_PROJECT_PATH_SLUG}-composer-lint"
    paths:
      - vendor/
      - /cache/composer/
    policy: pull-push
  script:
    - echo "Running full PHPCS scan for code quality report."
    - vendor/bin/phpcs --report=full --extensions=php --report-\\Micheh\\PhpCodeSniffer\\Report\\Gitlab=phpcs-quality-report.json  ./theme || true
    - echo "Full PHPCS scan completed."
  artifacts:
    reports:
      codequality: phpcs-quality-report.json
  allow_failure: true

