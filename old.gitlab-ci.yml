phpunit-test-job:
  image: composer:2.5
  stage: test
  interruptible: true
  variables:
    COMPOSER_CACHE_DIR: "/cache/composer"
  cache:
    key: "${CI_PROJECT_PATH_SLUG}-composer-tests"
    paths:
      - vendor/
      - /cache/composer/
    policy: pull-push
  before_script:
    - composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
  script:
    - echo "Running PHPUnit tests."
    - vendor/bin/phpunit --configuration phpunit.xml --log-junit junit-report.xml
    - echo "PHPUnit tests completed."
  artifacts:
    reports:
      junit: junit-report.xml
    paths:
      - junit-report.xml
  allow_failure: false

build-job:
  stage: build
  interruptible: true
  needs:
    - php-syntax-job
    - lint-job
    - lint-css-job
    - phpunit-test-job
    - phpcs-quality-job
      # - phpstan-quality-job
      # - phpmd-quality-job
  script:
    - *default_scripts
    - echo "Compiling the code..."
    - yarn cp
    - echo "Compile complete."
  artifacts:
    untracked: false
    when: on_success
    expire_in: "30 days"
    paths:
      - "webula/"
    name: ${CI_PROJECT_NAME}
